{% extends "base.html" %}
{% block title %}Jogadores - GameStats{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Jogadores</h1>
  <a class="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500" href="/players/new">Novo jogador</a>
</div>
<div class="overflow-hidden rounded-xl bg-white shadow ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
<table class="w-full text-left text-sm">
  <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500 dark:bg-slate-800/60 dark:text-slate-400">
    <tr>
      <th class="px-4 py-3 font-semibold">Nome</th>
      <th class="px-4 py-3 font-semibold">Apelido</th>
      <th class="px-4 py-3 text-right font-semibold">Ações</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
    {% for p in players %}
    <tr class="transition hover:bg-slate-50 dark:hover:bg-slate-800/50">
      <td class="px-4 py-3 font-medium text-slate-800 dark:text-slate-100">{{ p.name }}</td>
      <td class="px-4 py-3 text-slate-500 dark:text-slate-400">{{ p.nickname }}</td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-2">
          <a class="inline-flex items-center rounded-lg bg-indigo-50 px-3 py-1.5 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-100 dark:bg-indigo-500/20 dark:text-indigo-300 dark:hover:bg-indigo-500/30" href="/players/{{ p.player_id }}/edit">Editar</a>
          <form class="inline" method="post" action="/players/{{ p.player_id }}/delete">
            <button class="inline-flex items-center rounded-lg bg-rose-50 px-3 py-1.5 text-sm font-semibold text-rose-700 transition hover:bg-rose-100 dark:bg-rose-500/20 dark:text-rose-300 dark:hover:bg-rose-500/30" type="submit">Excluir</button>
          </form>
        </div>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="px-4 py-8 text-center text-slate-500 dark:text-slate-400">Nenhum jogador cadastrado.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
